<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ShelfTap · Danh mục ở cửa sổ vừa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{opacity:.85}
@keyframes st-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes st-item{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.st-rise{animation:st-rise 420ms cubic-bezier(.2,.8,.2,1) both}
.st-item{animation:st-item 240ms cubic-bezier(.2,.8,.2,1) both}
.st-press{transition:transform 120ms ease}
.st-press:active{transform:scale(0.96)}
/* book cards shrink a little while pressed; scale is its own property, so it does not fight the rise animation */
.st-card{transition:scale 120ms ease}.st-card:active{scale:.96}
@media (prefers-reduced-motion: reduce){
  .st-rise,.st-item{animation:none}
  .st-press,.st-card{transition:none}
}
.st-root{--bg:#ece7e1;--bg-rgb:236,231,225;--bg2:#d9d1c6;--surface:#ffffff;--glass:255,255,255;--edge:255,255,255;--ink:#1c1b1a;--ink-rgb:28,27,26;--ink2:#3d3833;--ink2b:#4a4540;--ink3:#5c554e;--primary:#1c1b1a;--on-primary:#ffffff;--ok:#2f5b3a;--danger:#7a3420;--danger2:#8a2f1b;--warn:#6b4a10;--warn2:#6b5220;--warn3:#8a6a2a;--warn-bg:#fff4dc;--danger-bg:#f6e4dc;--dialog:#f4f1ec;}
.st-root[data-theme="dark"]{--bg:#151412;--bg-rgb:21,20,18;--bg2:#1f1c19;--surface:#2a2723;--glass:44,40,36;--edge:96,88,79;--ink:#f2eee9;--ink-rgb:242,238,233;--ink2:#d3cbc1;--ink2b:#c6bdb2;--ink3:#a99f94;--primary:#f2eee9;--on-primary:#1c1b1a;--ok:#9fd3ac;--danger:#f0a58e;--danger2:#f0a58e;--warn:#f0c878;--warn2:#e6c27a;--warn3:#e6c27a;--warn-bg:#3a2e14;--danger-bg:#3b221a;--dialog:#2a2723;}
@media (prefers-color-scheme: dark){.st-root[data-theme="auto"]{--bg:#151412;--bg-rgb:21,20,18;--bg2:#1f1c19;--surface:#2a2723;--glass:44,40,36;--edge:96,88,79;--ink:#f2eee9;--ink-rgb:242,238,233;--ink2:#d3cbc1;--ink2b:#c6bdb2;--ink3:#a99f94;--primary:#f2eee9;--on-primary:#1c1b1a;--ok:#9fd3ac;--danger:#f0a58e;--danger2:#f0a58e;--warn:#f0c878;--warn2:#e6c27a;--warn3:#e6c27a;--warn-bg:#3a2e14;--danger-bg:#3b221a;--dialog:#2a2723;}}
.st-root button,.st-root input{color:var(--ink)}
.st-root ::placeholder{color:var(--ink3);opacity:1}
.st-root :is(button,a,[role="switch"]){position:relative}
.st-root :is(button,a,[role="switch"])::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,48px);height:max(100%,48px);transform:translate(-50%,-50%)}
.st-root input{min-width:0}
.st-scroll{scrollbar-width:none}.st-scroll::-webkit-scrollbar{display:none}
.st-scroll>*{flex-shrink:0}
</style>
</helmet>
<div class="st-root" data-theme="{{themeAttr}}" style="width: 720px; height: 840px; position: relative; overflow: hidden; background: var(--bg); font-family: 'Nunito', system-ui, sans-serif; color: var(--ink)">

  <!-- Content: one pane, text column capped at 560 px -->
  <div class="st-scroll" style="position: absolute; left: 96px; right: 0; top: 0; bottom: 0; padding: 56px 32px 40px; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 14px; color: var(--ink3)">Chào bạn,</div>
      <h1 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -0.3px">Hôm nay đọc gì?</h1>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 52px; max-width: 560px; padding: 0 18px; border-radius: 999px; background:  rgba(var(--glass),0.75); border: 1px solid rgba(var(--ink-rgb),0.5); box-shadow: 0 6px 20px rgba(60,45,30,0.06)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink3)"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm sách</span>
      <input type="search" placeholder="Tên sách, tác giả, ISBN" style="flex: 1; border: 0; background:  transparent; font: inherit; font-size: 15px; color: var(--ink); outline: none">
    </label>

    <section aria-label="Gợi ý cho bạn" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">Gợi ý cho bạn</h2>
        <a href="MidRecommend.dc.html" style="font-size: 13px; font-weight: 500; color: var(--ink3); padding: 12px 0 12px 12px; margin: -12px 0">Xem tất cả</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{recs}}" as="r" hint-placeholder-count="4">
          <a href="MidCatalog.dc.html" class="st-rise st-card" style="{{r.wrapStyle}}">
            <div aria-hidden="true" style="{{r.coverStyle}}">{{r.title}}</div>
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{r.title}}.</span>
            <div style="font-size: 12px; font-weight: 700; line-height: 1.35; color: var(--warn2)">{{r.reason}}</div>
          </a>
        </sc-for>
      </div>
      <div style="font-size: 11px; color: var(--ink3)">Tính trên máy từ sách bạn đã mượn. Tắt trong Tài khoản.</div>
    </section>

    <section aria-label="Văn học Việt Nam" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">Văn học Việt Nam</h2>
        <a href="MidCatalog.dc.html" style="font-size: 13px; font-weight: 500; color: var(--ink3); padding: 12px 0 12px 12px; margin: -12px 0">Xem tất cả</a>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{rows}}" as="b" hint-placeholder-count="6">
          <li class="st-rise" style="{{b.delay}}">
            <a href="MidCatalog.dc.html" class="st-card" style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 20px; background:  rgba(var(--glass),0.72); text-decoration: none; color: var(--ink); min-height: 48px; height: 100%; box-sizing: border-box">
              <div aria-hidden="true" style="{{b.cover}}">{{b.mono}}</div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <div style="font-size: 15px; font-weight: 700; line-height: 1.25">{{b.title}}</div>
                <div style="font-size: 13px; color: var(--ink2b); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.author}}</div>
                <div style="display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap">
                  <span style="{{b.pill}}">{{b.status}}</span>
                  <span style="font-size: 12px; color: var(--ink3)">Kệ {{b.shelf}}</span>
                </div>
              </div>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>
  </div>

  <!-- Navigation rail: replaces the ☰ menu and the floating checkout button on a medium window -->
  <nav aria-label="Điều hướng chính" style="position: absolute; left: 0; top: 0; bottom: 0; width: 96px; padding: 44px 8px 16px; box-sizing: border-box; background:  rgba(var(--glass),0.62); backdrop-filter: blur(26px) saturate(160%); -webkit-backdrop-filter: blur(26px) saturate(160%); border-right: 1px solid rgba(var(--edge),0.85); display: flex; flex-direction: column; align-items: center; gap: 4px">
    <a href="MidCheckout.dc.html" class="st-press" style="width: 80px; padding: 8px 0 6px; border-radius: 20px; background: var(--primary); color: var(--on-primary); display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 700; line-height: 1.2; text-align: center; box-shadow: 0 10px 24px rgba(28,27,26,0.25); margin-bottom: 16px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--on-primary)"><path d="M6 8.5a6 6 0 0 1 0 7"></path><path d="M9.5 6a10 10 0 0 1 0 12"></path><path d="M13 3.5a14 14 0 0 1 0 17"></path></svg>
      Chạm để mượn
    </a>
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="6">
      <a href="{{m.href}}" class="st-item" aria-current="{{m.current}}" style="{{m.style}}">
        <span style="{{m.pillStyle}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><path d="{{m.d1}}"></path><path d="{{m.d2}}"></path></svg>
        </span>
        {{m.label}}
      </a>
    </sc-for>
  </nav>

  <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" class="st-press" style="position: absolute; top: 12px; right: 14px; z-index: 50; height: 30px; padding: 0 12px 0 9px; border-radius: 999px; border: 1px solid rgba(var(--edge),0.7); background: rgba(var(--glass),0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">
    <sc-if value="{{themeIsLight}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
    <sc-if value="{{themeIsDark}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
    {{themeLabel}}
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":840}}'>
class Component extends DCLogic {
  __theme() {
    var self = this;
    var t = (this.state && this.state.__theme) || 'auto';
    var sys = typeof window !== 'undefined' && window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false;
    var dark = t === 'dark' || (t === 'auto' && sys);
    return {
      themeAttr: t,
      themeLabel: dark ? 'Sáng' : 'Tối',
      themeAria: dark ? 'Xem bản phác ở nền sáng' : 'Xem bản phác ở nền tối',
      themeIsDark: dark,
      themeIsLight: !dark,
      toggleTheme: function () { self.setState({ __theme: dark ? 'light' : 'dark' }); }
    };
  }
  renderVals() {
    var ci = 0;
    var rec = function (title, reason, bg, fg) {
      return {
        title: title, reason: reason,
        wrapStyle: 'animation-delay:' + (120 + 70 * ci++) + 'ms;display:flex;flex-direction:column;gap:8px;min-width:0;text-decoration:none;color:var(--ink)',
        coverStyle: 'height:176px;border-radius:22px;overflow:hidden;box-sizing:border-box;padding:14px 12px;font-size:15px;font-weight:700;line-height:1.2;background:' + bg + ';color:' + fg
      };
    };
    var mono = function (t) {
      var w = t.split(/\s+/);
      return (w[0][0] + (w[1] ? w[1][0] : '')).toUpperCase();
    };
    // same dev catalog as List.dc.html; "Đang được mượn" on Tắt đèn is sample state
    var books = [
      { t: 'Truyện Kiều', a: 'Nguyễn Du', n: 2, shelf: 'A01', bg: '#e7dcc6', fg: '#2f4a44' },
      { t: 'Dế Mèn phiêu lưu ký', a: 'Tô Hoài', n: 3, shelf: 'A02', bg: '#c9a66b', fg: '#1c1b1a' },
      { t: 'Số đỏ', a: 'Vũ Trọng Phụng', n: 2, shelf: 'A03', bg: '#b5452b', fg: '#ffffff' },
      { t: 'Tắt đèn', a: 'Ngô Tất Tố', n: 0, shelf: 'A04', bg: '#7a2e1e', fg: '#ffffff' },
      { t: 'Lão Hạc', a: 'Nam Cao', n: 1, shelf: 'A05', bg: '#d8c9a8', fg: '#3e3a36' },
      { t: 'Chí Phèo', a: 'Nam Cao', n: 1, shelf: 'A06', bg: '#3e3a36', fg: '#ffffff' }
    ];
    var n = 0;
    var railItem = function (label, href, d1, d2, active) {
      return {
        label: label, href: href, d1: d1, d2: d2, current: active ? 'page' : 'false',
        pillStyle: 'width:56px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:' + (active ? 'var(--surface)' : 'transparent') + ';box-shadow:' + (active ? '0 0 0 1px rgba(var(--ink-rgb),0.5)' : 'none'),
        style: 'animation-delay:' + (40 + 35 * n++) + 'ms;width:80px;min-height:56px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink);font-size:12px;line-height:1.2;text-align:center;font-weight:' + (active ? '700' : '500')
      };
    };
    return Object.assign(this.__theme(), {
      recs: [
        rec('Chí Phèo', 'Vì bạn đã mượn sách của Nam Cao', '#3e3a36', '#ffffff'),
        rec('The Pragmatic Programmer', 'Cùng chủ đề Software engineering', '#c9a66b', '#1c1b1a'),
        rec('Tắt đèn', 'Cùng chủ đề Tiểu thuyết', '#7a2e1e', '#ffffff'),
        rec('Truyện Kiều', 'Cùng chủ đề Văn học Việt Nam', '#e7dcc6', '#2f4a44')
      ],
      rows: books.map(function (b, i) {
        var lent = b.n === 0;
        return {
          title: b.t, author: b.a, shelf: b.shelf, mono: mono(b.t),
          status: lent ? 'Đang được mượn' : 'Còn ' + b.n + ' bản',
          delay: 'animation-delay:' + (200 + Math.min(i, 8) * 40) + 'ms',
          cover: 'width:44px;height:62px;flex:none;border-radius:10px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-size:13px;font-weight:700;letter-spacing:0.5px;background:' + b.bg + ';color:' + b.fg,
          pill: 'font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:' + (lent ? 'rgba(181,69,43,0.12)' : 'rgba(47,91,58,0.12)') + ';color:' + (lent ? 'var(--danger2)' : 'var(--ok)')
        };
      }),
      menu: [
        railItem('Danh mục', 'RailCatalog.dc.html', 'M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z', 'M8 7h7', true),
        railItem('Gợi ý', 'MidRecommend.dc.html', 'M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z', '', false),
        railItem('Đang mượn', 'MidLoans.dc.html', 'M12 7v5l3 2', 'M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9z', false),
        railItem('Đặt trước', 'MidReservations.dc.html', 'M6 3h12v18l-6-4-6 4z', 'M9 9h6', false),
        railItem('Lịch sử', 'MidHistory.dc.html', 'M3 12a9 9 0 1 0 3-6.7L3 8', 'M3 3v5h5', false),
        railItem('Tài khoản', 'MidAccount.dc.html', 'M4 21a8 8 0 0 1 16 0', 'M16 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0z', false)
      ]
    });
  }
}
</script>
</body>
</html>
