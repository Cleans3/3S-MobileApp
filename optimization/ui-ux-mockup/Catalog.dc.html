<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ShelfTap · Danh mục và menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{opacity:.85}
@keyframes st-scrim{from{opacity:0}to{opacity:1}}
@keyframes st-menu{from{opacity:0;transform:scale(0.92) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes st-item{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes st-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.st-scrim{animation:st-scrim 200ms ease-out both}
.st-menu{transform-origin:24px 0;animation:st-menu 260ms cubic-bezier(.2,.9,.25,1.05) both}
.st-item{animation:st-item 240ms cubic-bezier(.2,.8,.2,1) both}
.st-rise{animation:st-rise 420ms cubic-bezier(.2,.8,.2,1) both}
.st-bar{transform-origin:12px 12px;transition:transform 260ms cubic-bezier(.2,.8,.2,1),opacity 160ms ease}
.st-press{transition:transform 120ms ease}
.st-press:active{transform:scale(0.96)}
@media (prefers-reduced-motion: reduce){
  .st-scrim,.st-menu,.st-item,.st-rise{animation:none}
  .st-bar,.st-press{transition:none}
}
.st-root{--bg:#ece7e1;--bg-rgb:236,231,225;--bg2:#d9d1c6;--surface:#ffffff;--glass:255,255,255;--edge:255,255,255;--ink:#1c1b1a;--ink-rgb:28,27,26;--ink2:#3d3833;--ink2b:#4a4540;--ink3:#5c554e;--primary:#1c1b1a;--on-primary:#ffffff;--ok:#2f5b3a;--danger:#7a3420;--danger2:#8a2f1b;--warn:#6b4a10;--warn2:#6b5220;--warn3:#8a6a2a;--warn-bg:#fff4dc;--danger-bg:#f6e4dc;--dialog:#f4f1ec;}
.st-root[data-theme="dark"]{--bg:#151412;--bg-rgb:21,20,18;--bg2:#1f1c19;--surface:#2a2723;--glass:44,40,36;--edge:96,88,79;--ink:#f2eee9;--ink-rgb:242,238,233;--ink2:#d3cbc1;--ink2b:#c6bdb2;--ink3:#a99f94;--primary:#f2eee9;--on-primary:#1c1b1a;--ok:#9fd3ac;--danger:#f0a58e;--danger2:#f0a58e;--warn:#f0c878;--warn2:#e6c27a;--warn3:#e6c27a;--warn-bg:#3a2e14;--danger-bg:#3b221a;--dialog:#2a2723;}
@media (prefers-color-scheme: dark){.st-root[data-theme="auto"]{--bg:#151412;--bg-rgb:21,20,18;--bg2:#1f1c19;--surface:#2a2723;--glass:44,40,36;--edge:96,88,79;--ink:#f2eee9;--ink-rgb:242,238,233;--ink2:#d3cbc1;--ink2b:#c6bdb2;--ink3:#a99f94;--primary:#f2eee9;--on-primary:#1c1b1a;--ok:#9fd3ac;--danger:#f0a58e;--danger2:#f0a58e;--warn:#f0c878;--warn2:#e6c27a;--warn3:#e6c27a;--warn-bg:#3a2e14;--danger-bg:#3b221a;--dialog:#2a2723;}}
.st-root button,.st-root input{color:var(--ink)}
.st-root ::placeholder{color:var(--ink3);opacity:1}
</style>
</helmet>
<div class="st-root" data-theme="{{themeAttr}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); font-family: 'Nunito', system-ui, sans-serif; color: var(--ink)">

  <div style="position: absolute; inset: 0; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
      <div style="width: 48px"></div>
      <div style="font-size: 15px; font-weight: 600; color: var(--ink2b)">Thư viện ShelfTap</div>
      <button type="button" aria-label="Tài khoản" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid rgba(var(--edge),0.8); background:  rgba(var(--glass),0.6); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 14px; color: var(--ink3)">Chào bạn,</div>
      <h1 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -0.3px">Hôm nay đọc gì?</h1>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border-radius: 999px; background:  rgba(var(--glass),0.75); border: 1px solid rgba(var(--ink-rgb),0.5); box-shadow: 0 6px 20px rgba(60,45,30,0.06)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink3)"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm sách</span>
      <input type="search" placeholder="Tên sách, tác giả, ISBN" style="flex: 1; border: 0; background:  transparent; font: inherit; font-size: 15px; color: var(--ink); outline: none">
    </label>

    <a href="Detail.dc.html" class="st-rise" style="position: relative; height: 200px; border-radius: 28px; overflow: hidden; display: block; text-decoration: none; background:  #2f4a44">
      <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; gap: 12px; padding: 22px 0 0 22px">
        <sc-for list="{{banner}}" as="c" hint-placeholder-count="3">
          <div class="st-rise" style="{{c.style}}">
            <div style="font-size: 17px; font-weight: 700; line-height: 1.2">{{c.title}}</div>
            <div style="font-size: 11px; opacity: 0.85">{{c.author}}</div>
          </div>
        </sc-for>
      </div>
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); mask-image: linear-gradient(to bottom, transparent, #000 40%); -webkit-mask-image: linear-gradient(to bottom, transparent, #000 40%)"></div>
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); mask-image: linear-gradient(to bottom, transparent 35%, #000 75%); -webkit-mask-image: linear-gradient(to bottom, transparent 35%, #000 75%); background:  linear-gradient(to bottom, rgba(20,30,27,0), rgba(20,30,27,0.55))"></div>
      <div style="position: absolute; left: 20px; right: 16px; bottom: 16px; display: flex; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.9)">Chủ đề</div>
          <div style="font-size: 22px; font-weight: 700; color: #ffffff">Văn học Việt Nam</div>
        </div>
        <span style="width: 44px; height: 44px; border-radius: 999px; background:  rgba(var(--glass),0.25); border: 1px solid rgba(var(--edge),0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>
        </span>
      </div>
    </a>

    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700">Truyện ngắn và tiểu thuyết</h2>
      <a href="List.dc.html" style="font-size: 13px; font-weight: 500; color: var(--ink3); padding: 12px 0 12px 12px; margin: -12px 0">Xem tất cả</a>
    </div>

    <div style="display: flex; gap: 12px; margin-right: -20px">
      <sc-for list="{{row}}" as="c" hint-placeholder-count="4">
        <a href="Detail.dc.html" class="st-rise" style="{{c.cardStyle}}">
          <div style="font-size: 15px; font-weight: 700; line-height: 1.2; padding: 14px 12px 0">{{c.title}}</div>
          <div style="position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 8px 10px; border-radius: 14px; background:  rgba(var(--glass),0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--ink)">
            <div style="font-size: 12px; font-weight: 600">{{c.author}}</div>
            <div style="font-size: 11px; color: var(--ink2)">{{c.status}}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none">
    <div aria-hidden="true" style="position: absolute; inset: 0; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); mask-image: linear-gradient(to bottom, transparent, #000 60%); -webkit-mask-image: linear-gradient(to bottom, transparent, #000 60%)"></div>
  </div>
  <div style="position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%)">
    <a href="Checkout.dc.html" class="st-press" style="height: 56px; padding: 0 22px 0 8px; border-radius: 999px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 15px; font-weight: 600; white-space: nowrap; box-shadow: 0 10px 30px rgba(28,27,26,0.3)">
      <span style="width: 40px; height: 40px; border-radius: 999px; background:  rgba(var(--glass),0.16); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--on-primary)"><path d="M6 8.5a6 6 0 0 1 0 7"></path><path d="M9.5 6a10 10 0 0 1 0 12"></path><path d="M13 3.5a14 14 0 0 1 0 17"></path></svg>
      </span>
      Chạm sách để mượn
    </a>
  </div>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ true }}">
    <button type="button" class="st-scrim" aria-label="Đóng menu" onClick="{{closeMenu}}" style="position: absolute; inset: 0; border: 0; padding: 0; background:  rgba(28,22,16,0.16); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); cursor: pointer"></button>
    <nav aria-label="Điều hướng chính" class="st-menu" style="position: absolute; top: 116px; left: 16px; width: 256px; padding: 10px; border-radius: 30px; background:  rgba(var(--glass),0.62); backdrop-filter: blur(26px) saturate(160%); -webkit-backdrop-filter: blur(26px) saturate(160%); border: 1px solid rgba(var(--edge),0.85); box-shadow: 0 24px 60px rgba(40,28,18,0.22); display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="5">
        <a href="{{m.href}}" class="st-item" style="{{m.style}}">
          <span style="width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{m.iconBg}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><path d="{{m.d1}}"></path><path d="{{m.d2}}"></path></svg>
          </span>
          {{m.label}}
        </a>
      </sc-for>
      <div style="height: 1px; background:  rgba(var(--ink-rgb),0.1); margin: 6px 10px"></div>
      <div style="padding: 6px 14px 8px; font-size: 12px; color: var(--ink3)">Mượn sách: dùng nút nổi ở cuối màn hình</div>
    </nav>
  </sc-if>

  <button type="button" aria-label="{{menuLabel}}" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}" style="position: absolute; top: 56px; left: 20px; width: 48px; height: 48px; border-radius: 999px; border: 1px solid rgba(var(--edge),0.85); background:  rgba(var(--glass),0.62); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="color: var(--ink)"><path class="st-bar" d="M4 7h16" style="{{bar1}}"></path><path class="st-bar" d="M4 12h16" style="{{bar2}}"></path><path class="st-bar" d="M4 17h16" style="{{bar3}}"></path></svg>
  </button>
  <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" class="st-press" style="position: absolute; top: 12px; right: 14px; z-index: 50; height: 30px; padding: 0 12px 0 9px; border-radius: 999px; border: 1px solid rgba(var(--edge),0.7); background: rgba(var(--glass),0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">
    <sc-if value="{{themeIsLight}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
    <sc-if value="{{themeIsDark}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
    {{themeLabel}}
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startOpen":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  __theme() {
    var self = this;
    var t = (this.state && this.state.__theme) || 'auto';
    var sys = typeof window !== 'undefined' && window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false;
    var dark = t === 'dark' || (t === 'auto' && sys);
    var opts = [['auto', 'Theo hệ thống'], ['light', 'Sáng'], ['dark', 'Tối']];
    return {
      themeAttr: t,
      themeLabel: dark ? 'Sáng' : 'Tối',
      themeAria: dark ? 'Xem bản phác ở nền sáng' : 'Xem bản phác ở nền tối',
      themeIsDark: dark,
      themeIsLight: !dark,
      toggleTheme: function () { self.setState({ __theme: dark ? 'light' : 'dark' }); },
      themeOpts: opts.map(function (o) {
        var on = o[0] === t;
        return {
          label: o[1], on: on,
          pick: function () { self.setState({ __theme: o[0] }); },
          style: 'height:40px;border-radius:999px;border:0;font:inherit;font-size:13px;font-weight:' + (on ? '700' : '500') + ';cursor:pointer;background:' + (on ? 'var(--primary)' : 'transparent') + ';color:' + (on ? 'var(--on-primary)' : 'var(--ink2)')
        };
      })
    };
  }
  renderVals() {
    var open = this.state && this.state.open !== undefined ? this.state.open : (this.props.startOpen ?? true);
    var self = this;
    var ki = 0, ci = 0;
    var cover = function (bg, fg, w, h) {
      return 'animation-delay:' + (160 + 90 * ki++) + 'ms;width:' + w + 'px;height:' + h + 'px;flex:none;border-radius:16px;background:' + bg + ';color:' + fg + ';padding:14px 12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px rgba(0,0,0,0.18)';
    };
    var card = function (bg, fg) {
      return 'animation-delay:' + (140 + 70 * ci++) + 'ms;position:relative;display:block;width:132px;height:196px;flex:none;border-radius:22px;overflow:hidden;text-decoration:none;background:' + bg + ';color:' + fg;
    };
    var n = 0;
    var menuItem = function (label, href, d1, d2, active) {
      var delay = 60 + 35 * n++;
      return {
        label: label, href: href, d1: d1, d2: d2,
        iconBg: active ? 'var(--surface)' : 'rgba(var(--glass),0.5)',
        style: 'animation-delay:' + delay + 'ms;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 10px;border-radius:20px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:' + (active ? '700' : '500') + ';background:' + (active ? 'rgba(var(--glass),0.85)' : 'transparent')
      };
    };
    return Object.assign(this.__theme(), {
      menuOpen: open,
      menuClosed: !open,
      bar1: open ? 'transform:rotate(45deg) translateY(5px)' : 'transform:none',
      bar2: open ? 'opacity:0;transform:scaleX(0.2)' : 'opacity:1;transform:none',
      bar3: open ? 'transform:rotate(-45deg) translateY(-5px)' : 'transform:none',
      menuLabel: open ? 'Đóng menu' : 'Mở menu',
      toggleMenu: function () { self.setState({ open: !open }); },
      closeMenu: function () { self.setState({ open: false }); },
      banner: [
        { title: 'Truyện Kiều', author: 'Nguyễn Du', style: cover('#e7dcc6', '#2f4a44', 104, 150) },
        { title: 'Tắt đèn', author: 'Ngô Tất Tố', style: cover('#b5452b', '#ffffff', 104, 150) },
        { title: 'Lão Hạc', author: 'Nam Cao', style: cover('#d8c9a8', '#3e3a36', 104, 150) }
      ],
      row: [
        { title: 'Dế Mèn phiêu lưu ký', author: 'Tô Hoài', status: 'Còn sách', cardStyle: card('#c9a66b', '#1c1b1a') },
        { title: 'Số đỏ', author: 'Vũ Trọng Phụng', status: 'Còn sách', cardStyle: card('#b5452b', '#ffffff') },
        { title: 'Chí Phèo', author: 'Nam Cao', status: 'Còn sách', cardStyle: card('#3e3a36', '#ffffff') }
      ],
      menu: [
        menuItem('Danh mục', 'Catalog.dc.html', 'M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z', 'M8 7h7', true),
        menuItem('Sách đang mượn', 'Loans.dc.html', 'M12 7v5l3 2', 'M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9z', false),
        menuItem('Đặt trước', 'Reservations.dc.html', 'M6 3h12v18l-6-4-6 4z', 'M9 9h6', false),
        menuItem('Lịch sử đọc', 'History.dc.html', 'M3 12a9 9 0 1 0 3-6.7L3 8', 'M3 3v5h5', false),
        menuItem('Tài khoản', 'Account.dc.html', 'M4 21a8 8 0 0 1 16 0', 'M16 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0z', false)
      ]
    });
  }
}
</script>
</body>
</html>
