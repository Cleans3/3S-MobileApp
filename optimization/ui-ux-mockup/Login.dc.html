<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ShelfTap · Đăng nhập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{opacity:.85}
@keyframes st-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes st-fade{from{opacity:0}to{opacity:1}}
@keyframes st-pop{0%{opacity:0;scale:.6}70%{opacity:1;scale:1.06}100%{opacity:1;scale:1}}
@keyframes st-draw{to{stroke-dashoffset:0}}
@keyframes st-ping{0%{opacity:.55;scale:1}100%{opacity:0;scale:1.35}}
@keyframes st-breathe{0%,100%{scale:1}50%{scale:1.04}}
@keyframes st-sheet{from{transform:translateY(110%)}to{transform:none}}
@keyframes st-shake{0%,100%{translate:0 0}20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
.st-rise{animation:st-rise 420ms cubic-bezier(.2,.8,.2,1) both}
.st-fade{animation:st-fade 260ms ease-out both}
.st-pop{animation:st-pop 380ms cubic-bezier(.2,.8,.2,1) both}
.st-draw{stroke-dasharray:30;stroke-dashoffset:30;animation:st-draw 420ms 180ms ease-out forwards}
.st-ping{opacity:0;animation:st-ping 1.8s cubic-bezier(.2,.6,.3,1) infinite}
.st-late{animation-delay:.9s}
.st-breathe{animation:st-breathe 2.4s ease-in-out infinite}
.st-sheet{animation:st-sheet 320ms cubic-bezier(.2,.9,.25,1) both}
.st-shake{animation:st-shake 360ms ease both}
.st-press{transition:scale 120ms ease}.st-press:active{scale:.96}
.st-swap{transition:background-color 220ms ease,color 220ms ease}
.st-knob{transition:transform 220ms cubic-bezier(.2,.8,.2,1)}
.d1{animation-delay:80ms}.d2{animation-delay:160ms}.d3{animation-delay:240ms}
@media (prefers-reduced-motion: reduce){
  .st-rise,.st-fade,.st-pop,.st-ping,.st-breathe,.st-sheet,.st-shake{animation:none}
  .st-draw{animation:none;stroke-dashoffset:0}
  .st-press,.st-swap,.st-knob{transition:none}
}
.st-root{--bg:#ece7e1;--bg-rgb:236,231,225;--bg2:#d9d1c6;--surface:#ffffff;--glass:255,255,255;--edge:255,255,255;--ink:#1c1b1a;--ink-rgb:28,27,26;--ink2:#3d3833;--ink2b:#4a4540;--ink3:#5c554e;--primary:#1c1b1a;--on-primary:#ffffff;--ok:#2f5b3a;--danger:#7a3420;--danger2:#8a2f1b;--warn:#6b4a10;--warn2:#6b5220;--warn3:#8a6a2a;--warn-bg:#fff4dc;--danger-bg:#f6e4dc;--dialog:#f4f1ec;}
.st-root[data-theme="dark"]{--bg:#151412;--bg-rgb:21,20,18;--bg2:#1f1c19;--surface:#2a2723;--glass:44,40,36;--edge:96,88,79;--ink:#f2eee9;--ink-rgb:242,238,233;--ink2:#d3cbc1;--ink2b:#c6bdb2;--ink3:#a99f94;--primary:#f2eee9;--on-primary:#1c1b1a;--ok:#9fd3ac;--danger:#f0a58e;--danger2:#f0a58e;--warn:#f0c878;--warn2:#e6c27a;--warn3:#e6c27a;--warn-bg:#3a2e14;--danger-bg:#3b221a;--dialog:#2a2723;}
@media (prefers-color-scheme: dark){.st-root[data-theme="auto"]{--bg:#151412;--bg-rgb:21,20,18;--bg2:#1f1c19;--surface:#2a2723;--glass:44,40,36;--edge:96,88,79;--ink:#f2eee9;--ink-rgb:242,238,233;--ink2:#d3cbc1;--ink2b:#c6bdb2;--ink3:#a99f94;--primary:#f2eee9;--on-primary:#1c1b1a;--ok:#9fd3ac;--danger:#f0a58e;--danger2:#f0a58e;--warn:#f0c878;--warn2:#e6c27a;--warn3:#e6c27a;--warn-bg:#3a2e14;--danger-bg:#3b221a;--dialog:#2a2723;}}
.st-root button,.st-root input{color:var(--ink)}
.st-root ::placeholder{color:var(--ink3);opacity:1}
</style>
</helmet>
<div class="st-root" data-theme="{{themeAttr}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); font-family: 'Nunito', system-ui, sans-serif; color: var(--ink)">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 360px; overflow: hidden; background: var(--bg2)">
    <div style="display: flex; flex-direction: column; padding-top: 30px">
      <sc-for list="{{shelves}}" as="shelf" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column">
          <div style="height: 150px; display: flex; align-items: flex-end; gap: 4px; padding: 0 14px">
            <sc-for list="{{shelf.books}}" as="b" hint-placeholder-count="12">
              <div style="{{b.style}}"></div>
            </sc-for>
          </div>
          <div style="height: 9px; background:  #8a7461"></div>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; inset: 0; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); mask-image: linear-gradient(to bottom, transparent 20%, #000 55%); -webkit-mask-image: linear-gradient(to bottom, transparent 20%, #000 55%)"></div>
    <div style="position: absolute; inset: 0; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); mask-image: linear-gradient(to bottom, transparent 45%, #000 85%); -webkit-mask-image: linear-gradient(to bottom, transparent 45%, #000 85%); background:  linear-gradient(to bottom, rgba(var(--bg-rgb),0) 50%, rgba(var(--bg-rgb),1) 100%)"></div>
  </div>

  <a href="Main.dc.html" aria-label="Quay lại" style="position: absolute; top: 56px; left: 20px; width: 48px; height: 48px; border-radius: 999px; border: 1px solid rgba(var(--edge),0.8); background:  rgba(var(--glass),0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; text-decoration: none">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><path d="m15 18-6-6 6-6"></path></svg>
  </a>

  <form class="st-rise" style="position: absolute; left: 16px; right: 16px; top: 250px; padding: 24px 20px 20px; border-radius: 32px; background:  rgba(var(--glass),0.68); backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); border: 1px solid rgba(var(--edge),0.9); box-shadow: 0 24px 60px rgba(40,28,18,0.12); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.3px">Đăng nhập</h1>
      <p style="margin: 0; font-size: 14px; color: var(--ink2b)">Dùng tài khoản thư viện đã cấp cho bạn.</p>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink2)">
      Email
      <input type="email" value="member@shelftap.test" autocomplete="username" style="height: 50px; padding: 0 16px; border-radius: 16px; border: 1px solid rgba(var(--ink-rgb),0.14); background: var(--surface); font: inherit; font-size: 15px; font-weight: 400; color: var(--ink)">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink2)">
      Mật khẩu
      <span style="position: relative; display: flex">
        <input type="{{pwType}}" value="mật khẩu mẫu" autocomplete="current-password" style="flex: 1; height: 50px; padding: 0 52px 0 16px; border-radius: 16px; border: 1px solid rgba(var(--ink-rgb),0.14); background: var(--surface); font: inherit; font-size: 15px; font-weight: 400; color: var(--ink)">
        <button type="button" onClick="{{toggleShow}}" aria-label="{{eyeLabel}}" style="position: absolute; right: 4px; top: 3px; width: 44px; height: 44px; border: 0; border-radius: 12px; background:  transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <sc-if value="{{show}}" hint-placeholder-val="{{ false }}">
            <svg class="st-pop" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink2)"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9"></path><path d="M6.6 6.6C3.7 8.4 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
          </sc-if>
          <sc-if value="{{hidden}}" hint-placeholder-val="{{ true }}">
            <svg class="st-pop" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink2)"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </sc-if>
        </button>
      </span>
    </label>

    <a href="ChangePassword.dc.html" style="height: 54px; border-radius: 999px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 600; margin-top: 4px">Đăng nhập</a>

    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink3)">
      <div style="flex: 1; height: 1px; background:  rgba(var(--ink-rgb),0.12)"></div>
      hoặc
      <div style="flex: 1; height: 1px; background:  rgba(var(--ink-rgb),0.12)"></div>
    </div>

    <a href="CardLogin.dc.html" style="height: 54px; border-radius: 999px; background:  rgba(var(--glass),0.85); border: 1px solid rgba(var(--ink-rgb),0.12); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 15px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h4"></path><path d="M15.5 9.5a3 3 0 0 1 0 5"></path></svg>
      Đăng nhập bằng thẻ thư viện
    </a>
  </form>

  <p style="position: absolute; left: 24px; right: 24px; bottom: 40px; margin: 0; text-align: center; font-size: 13px; line-height: 1.5; color: var(--ink2b)">Chưa có tài khoản? Đăng ký tại quầy thủ thư, mang theo CCCD.</p>
  <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" class="st-press" style="position: absolute; top: 12px; right: 14px; z-index: 50; height: 30px; padding: 0 12px 0 9px; border-radius: 999px; border: 1px solid rgba(var(--edge),0.7); background: rgba(var(--glass),0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">
    <sc-if value="{{themeIsLight}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
    <sc-if value="{{themeIsDark}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
    {{themeLabel}}
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  __theme() {
    var self = this;
    var t = (this.state && this.state.__theme) || 'auto';
    var sys = typeof window !== 'undefined' && window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false;
    var dark = t === 'dark' || (t === 'auto' && sys);
    var opts = [['auto', 'Theo hệ thống'], ['light', 'Sáng'], ['dark', 'Tối']];
    return {
      themeAttr: t,
      themeLabel: dark ? 'Sáng' : 'Tối',
      themeAria: dark ? 'Xem bản phác ở nền sáng' : 'Xem bản phác ở nền tối',
      themeIsDark: dark,
      themeIsLight: !dark,
      toggleTheme: function () { self.setState({ __theme: dark ? 'light' : 'dark' }); },
      themeOpts: opts.map(function (o) {
        var on = o[0] === t;
        return {
          label: o[1], on: on,
          pick: function () { self.setState({ __theme: o[0] }); },
          style: 'height:40px;border-radius:999px;border:0;font:inherit;font-size:13px;font-weight:' + (on ? '700' : '500') + ';cursor:pointer;background:' + (on ? 'var(--primary)' : 'transparent') + ';color:' + (on ? 'var(--on-primary)' : 'var(--ink2)')
        };
      })
    };
  }
  renderVals() {
    var self = this;
    var show = !!(this.state && this.state.show);
    var palette = ['#8e5a3c', '#2f4a44', '#c9a66b', '#6b6f7a', '#b5452b', '#3e3a36', '#d8c9a8', '#556b5a', '#a3633f', '#41506b'];
    var widths = [22, 30, 18, 26, 34, 20, 28, 24, 16, 30, 22, 26];
    var heights = [130, 112, 140, 100, 126, 144, 108, 132, 120, 104, 138, 116];
    var shelves = [];
    for (var s = 0; s < 2; s++) {
      var books = [];
      for (var i = 0; i < 12; i++) {
        books.push({ style: 'width:' + widths[(i + s * 3) % 12] + 'px;height:' + heights[(i * 5 + s) % 12] + 'px;background:' + palette[(i * 3 + s * 7) % 10] + ';border-radius:2px 2px 0 0' });
      }
      shelves.push({ books: books });
    }
    return Object.assign(this.__theme(), {
      shelves: shelves,
      show: show,
      hidden: !show,
      pwType: show ? 'text' : 'password',
      eyeLabel: show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu',
      toggleShow: function () { self.setState({ show: !show }); }
    });
  }
}
</script>
</body>
</html>
