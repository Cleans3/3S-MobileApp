<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ShelfTap · Chi tiết sách</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{opacity:.85}
@keyframes st-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes st-fade{from{opacity:0}to{opacity:1}}
@keyframes st-pop{0%{opacity:0;scale:.6}70%{opacity:1;scale:1.06}100%{opacity:1;scale:1}}
@keyframes st-draw{to{stroke-dashoffset:0}}
@keyframes st-ping{0%{opacity:.55;scale:1}100%{opacity:0;scale:1.35}}
@keyframes st-breathe{0%,100%{scale:1}50%{scale:1.04}}
@keyframes st-sheet{from{transform:translateY(110%)}to{transform:none}}
@keyframes st-shake{0%,100%{translate:0 0}20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
.st-rise{animation:st-rise 420ms cubic-bezier(.2,.8,.2,1) both}
.st-fade{animation:st-fade 260ms ease-out both}
.st-pop{animation:st-pop 380ms cubic-bezier(.2,.8,.2,1) both}
.st-draw{stroke-dasharray:30;stroke-dashoffset:30;animation:st-draw 420ms 180ms ease-out forwards}
.st-ping{opacity:0;animation:st-ping 1.8s cubic-bezier(.2,.6,.3,1) infinite}
.st-late{animation-delay:.9s}
.st-breathe{animation:st-breathe 2.4s ease-in-out infinite}
.st-sheet{animation:st-sheet 320ms cubic-bezier(.2,.9,.25,1) both}
.st-shake{animation:st-shake 360ms ease both}
.st-press{transition:scale 120ms ease}.st-press:active{scale:.96}
.st-swap{transition:background-color 220ms ease,color 220ms ease}
.st-knob{transition:transform 220ms cubic-bezier(.2,.8,.2,1)}
.d1{animation-delay:80ms}.d2{animation-delay:160ms}.d3{animation-delay:240ms}
@media (prefers-reduced-motion: reduce){
  .st-rise,.st-fade,.st-pop,.st-ping,.st-breathe,.st-sheet,.st-shake{animation:none}
  .st-draw{animation:none;stroke-dashoffset:0}
  .st-press,.st-swap,.st-knob{transition:none}
}
.st-root{--bg:#ece7e1;--bg-rgb:236,231,225;--bg2:#d9d1c6;--surface:#ffffff;--glass:255,255,255;--edge:255,255,255;--ink:#1c1b1a;--ink-rgb:28,27,26;--ink2:#3d3833;--ink2b:#4a4540;--ink3:#5c554e;--primary:#1c1b1a;--on-primary:#ffffff;--ok:#2f5b3a;--danger:#7a3420;--danger2:#8a2f1b;--warn:#6b4a10;--warn2:#6b5220;--warn3:#8a6a2a;--warn-bg:#fff4dc;--danger-bg:#f6e4dc;--dialog:#f4f1ec;}
.st-root[data-theme="dark"]{--bg:#151412;--bg-rgb:21,20,18;--bg2:#1f1c19;--surface:#2a2723;--glass:44,40,36;--edge:96,88,79;--ink:#f2eee9;--ink-rgb:242,238,233;--ink2:#d3cbc1;--ink2b:#c6bdb2;--ink3:#a99f94;--primary:#f2eee9;--on-primary:#1c1b1a;--ok:#9fd3ac;--danger:#f0a58e;--danger2:#f0a58e;--warn:#f0c878;--warn2:#e6c27a;--warn3:#e6c27a;--warn-bg:#3a2e14;--danger-bg:#3b221a;--dialog:#2a2723;}
@media (prefers-color-scheme: dark){.st-root[data-theme="auto"]{--bg:#151412;--bg-rgb:21,20,18;--bg2:#1f1c19;--surface:#2a2723;--glass:44,40,36;--edge:96,88,79;--ink:#f2eee9;--ink-rgb:242,238,233;--ink2:#d3cbc1;--ink2b:#c6bdb2;--ink3:#a99f94;--primary:#f2eee9;--on-primary:#1c1b1a;--ok:#9fd3ac;--danger:#f0a58e;--danger2:#f0a58e;--warn:#f0c878;--warn2:#e6c27a;--warn3:#e6c27a;--warn-bg:#3a2e14;--danger-bg:#3b221a;--dialog:#2a2723;}}
.st-root button,.st-root input{color:var(--ink)}
.st-root ::placeholder{color:var(--ink3);opacity:1}
.st-root :is(button,a,[role="switch"]){position:relative}
.st-root :is(button,a,[role="switch"])::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,48px);height:max(100%,48px);transform:translate(-50%,-50%)}
.st-root input{min-width:0}
</style>
</helmet>
<div class="st-root" data-theme="{{themeAttr}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); font-family: 'Nunito', system-ui, sans-serif; color: var(--ink)">

  <div style="position: absolute; top: 56px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center">
    <a href="Catalog.dc.html" aria-label="Quay lại danh mục" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid rgba(var(--edge),0.8); background:  rgba(var(--glass),0.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; gap: 10px">
      <button type="button" aria-label="Chia sẻ" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid rgba(var(--edge),0.8); background:  rgba(var(--glass),0.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><path d="M12 3v12"></path><path d="m7 8 5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
      </button>
    </div>
  </div>

  <div class="st-page" style="position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; scrollbar-width: none">
  <div style="position: relative; min-height: max(100%, 844px)">
  <div aria-hidden="true" class="st-fade" style="position: absolute; left: 0; right: 0; top: 0; height: 480px; overflow: hidden; background:  #d7c39a; color: #1c1b1a">
    <div style="position: absolute; left: -60px; top: -40px; width: 300px; height: 300px; border-radius: 999px; background:  #c9a66b; color: #1c1b1a"></div>
    <div style="position: absolute; right: -80px; top: 120px; width: 280px; height: 280px; border-radius: 999px; background:  #e4d6b8; color: #1c1b1a"></div>
    <div style="position: absolute; left: 50%; top: 104px; transform: translateX(-50%) rotate(-3deg); width: 200px; height: 296px; border-radius: 10px 18px 18px 10px; background:  #c9a66b; box-shadow: 0 30px 60px rgba(70,50,20,0.35), inset 10px 0 0 rgba(0,0,0,0.08); padding: 26px 20px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink)">
      <div style="font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.4px">Dế Mèn phiêu lưu ký</div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="width: 48px; height: 3px; background: var(--primary)"></div>
        <div style="font-size: 14px; font-weight: 600">Tô Hoài</div>
      </div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); mask-image: linear-gradient(to bottom, transparent, #000 40%); -webkit-mask-image: linear-gradient(to bottom, transparent, #000 40%)"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); mask-image: linear-gradient(to bottom, transparent 30%, #000 70%); -webkit-mask-image: linear-gradient(to bottom, transparent 30%, #000 70%)"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); mask-image: linear-gradient(to bottom, transparent 60%, #000 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 60%, #000 100%); background:  linear-gradient(to bottom, rgba(var(--bg-rgb),0) 40%, rgba(var(--bg-rgb),1) 100%)"></div>
  </div>

  <div class="st-rise d1" style="position: absolute; left: 24px; right: 24px; top: 448px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="padding: 6px 12px; border-radius: 999px; background:  rgba(var(--glass),0.8); font-size: 12px; font-weight: 500; color: var(--ink2)">Thiếu nhi</span>
      <span style="padding: 6px 12px; border-radius: 999px; background:  rgba(var(--glass),0.8); font-size: 12px; font-weight: 500; color: var(--ink2)">Văn học Việt Nam</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.3px">Dế Mèn phiêu lưu ký</h1>
      <div style="font-size: 15px; color: var(--ink2b)">Tô Hoài</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 12px; border-radius: 18px; background: var(--surface); display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 11px; color: var(--ink3)">Tình trạng</div>
        <div style="font-size: 15px; font-weight: 700; color: var(--ok)">Còn 3 bản</div>
      </div>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink2b)">[Mô tả sách: chưa có trong dữ liệu danh mục] · ISBN 9780990000020</p>
  </div>
  </div>
  </div>
  <div class="st-rise d2" style="position: absolute; left: 16px; right: 16px; bottom: 30px; padding: 8px; border-radius: 999px; background:  rgba(var(--glass),0.62); backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); border: 1px solid rgba(var(--edge),0.9); box-shadow: 0 16px 40px rgba(40,28,18,0.16); display: flex; gap: 8px; align-items: center">
    <button type="button" aria-label="Mượn bằng cách chạm điện thoại vào sách" style="width: 52px; height: 52px; flex: none; border-radius: 999px; border: 0; background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><path d="M6 8.5a6 6 0 0 1 0 7"></path><path d="M9.5 6a10 10 0 0 1 0 12"></path><path d="M13 3.5a14 14 0 0 1 0 17"></path></svg>
    </button>
    <button type="button" onClick="{{reserve}}" aria-live="polite" class="st-swap st-press" style="{{reserveStyle}}">
      <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
        <svg class="st-pop" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path><path class="st-draw" d="m9 10 2 2 4-4"></path></svg>
      </sc-if>
      <sc-if value="{{isIdle}}" hint-placeholder-val="{{ true }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
      </sc-if>
      {{reserveLabel}}
    </button>
  </div>
  <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" class="st-press" style="position: absolute; top: 12px; right: 14px; z-index: 50; height: 30px; padding: 0 12px 0 9px; border-radius: 999px; border: 1px solid rgba(var(--edge),0.7); background: rgba(var(--glass),0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">
    <sc-if value="{{themeIsLight}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
    <sc-if value="{{themeIsDark}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
    {{themeLabel}}
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  __theme() {
    var self = this;
    var t = (this.state && this.state.__theme) || 'auto';
    var sys = typeof window !== 'undefined' && window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false;
    var dark = t === 'dark' || (t === 'auto' && sys);
    var opts = [['auto', 'Theo hệ thống'], ['light', 'Sáng'], ['dark', 'Tối']];
    return {
      themeAttr: t,
      themeLabel: dark ? 'Sáng' : 'Tối',
      themeAria: dark ? 'Xem bản phác ở nền sáng' : 'Xem bản phác ở nền tối',
      themeIsDark: dark,
      themeIsLight: !dark,
      toggleTheme: function () { self.setState({ __theme: dark ? 'light' : 'dark' }); },
      themeOpts: opts.map(function (o) {
        var on = o[0] === t;
        return {
          label: o[1], on: on,
          pick: function () { self.setState({ __theme: o[0] }); },
          style: 'height:40px;border-radius:999px;border:0;font:inherit;font-size:13px;font-weight:' + (on ? '700' : '500') + ';cursor:pointer;background:' + (on ? 'var(--primary)' : 'transparent') + ';color:' + (on ? 'var(--on-primary)' : 'var(--ink2)')
        };
      })
    };
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }
  renderVals() {
    var self = this;
    var phase = (this.state && this.state.phase) || 'idle';
    var labels = { idle: 'Đặt trước sách này', sending: 'Đang gửi yêu cầu…', done: 'Đã đặt trước · thư viện xác nhận' };
    var bg = { idle: 'var(--primary)', sending: '#5c554e', done: '#2f5b3a' };
    return Object.assign(this.__theme(), {
      isIdle: phase === 'idle',
      isDone: phase === 'done',
      reserveLabel: labels[phase],
      reserveStyle: 'flex:1;height:52px;border-radius:999px;border:0;background:' + bg[phase] + ';color:' + (phase === 'idle' ? 'var(--on-primary)' : '#ffffff') + ';display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:15px;font-weight:600;cursor:pointer',
      reserve: function () {
        if (phase === 'sending') return;
        if (phase === 'done') { self.setState({ phase: 'idle' }); return; }
        self.setState({ phase: 'sending' });
        self.timer = setTimeout(function () { self.setState({ phase: 'done' }); }, 1200);
      }
    });
  }
}
</script>
</body>
</html>
