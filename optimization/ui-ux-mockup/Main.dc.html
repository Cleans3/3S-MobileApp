<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ShelfTap · Màn chào</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffffff}a:hover{opacity:.85}
@keyframes st-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes st-fade{from{opacity:0}to{opacity:1}}
@keyframes st-pop{0%{opacity:0;scale:.6}70%{opacity:1;scale:1.06}100%{opacity:1;scale:1}}
@keyframes st-draw{to{stroke-dashoffset:0}}
@keyframes st-ping{0%{opacity:.55;scale:1}100%{opacity:0;scale:1.35}}
@keyframes st-breathe{0%,100%{scale:1}50%{scale:1.04}}
@keyframes st-sheet{from{transform:translateY(110%)}to{transform:none}}
@keyframes st-shake{0%,100%{translate:0 0}20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
.st-rise{animation:st-rise 420ms cubic-bezier(.2,.8,.2,1) both}
.st-fade{animation:st-fade 260ms ease-out both}
.st-pop{animation:st-pop 380ms cubic-bezier(.2,.8,.2,1) both}
.st-draw{stroke-dasharray:30;stroke-dashoffset:30;animation:st-draw 420ms 180ms ease-out forwards}
.st-ping{opacity:0;animation:st-ping 1.8s cubic-bezier(.2,.6,.3,1) infinite}
.st-late{animation-delay:.9s}
.st-breathe{animation:st-breathe 2.4s ease-in-out infinite}
.st-sheet{animation:st-sheet 320ms cubic-bezier(.2,.9,.25,1) both}
.st-shake{animation:st-shake 360ms ease both}
.st-press{transition:scale 120ms ease}.st-press:active{scale:.96}
.st-swap{transition:background-color 220ms ease,color 220ms ease}
.st-knob{transition:transform 220ms cubic-bezier(.2,.8,.2,1)}
.d1{animation-delay:80ms}.d2{animation-delay:160ms}.d3{animation-delay:240ms}
@media (prefers-reduced-motion: reduce){
  .st-rise,.st-fade,.st-pop,.st-ping,.st-breathe,.st-sheet,.st-shake{animation:none}
  .st-draw{animation:none;stroke-dashoffset:0}
  .st-press,.st-swap,.st-knob{transition:none}
}
.st-root{--bg:#ece7e1;--bg-rgb:236,231,225;--bg2:#d9d1c6;--surface:#ffffff;--glass:255,255,255;--edge:255,255,255;--ink:#1c1b1a;--ink-rgb:28,27,26;--ink2:#3d3833;--ink2b:#4a4540;--ink3:#5c554e;--primary:#1c1b1a;--on-primary:#ffffff;--ok:#2f5b3a;--danger:#7a3420;--danger2:#8a2f1b;--warn:#6b4a10;--warn2:#6b5220;--warn3:#8a6a2a;--warn-bg:#fff4dc;--danger-bg:#f6e4dc;--dialog:#f4f1ec;}
.st-root[data-theme="dark"]{--bg:#151412;--bg-rgb:21,20,18;--bg2:#1f1c19;--surface:#2a2723;--glass:44,40,36;--edge:96,88,79;--ink:#f2eee9;--ink-rgb:242,238,233;--ink2:#d3cbc1;--ink2b:#c6bdb2;--ink3:#a99f94;--primary:#f2eee9;--on-primary:#1c1b1a;--ok:#9fd3ac;--danger:#f0a58e;--danger2:#f0a58e;--warn:#f0c878;--warn2:#e6c27a;--warn3:#e6c27a;--warn-bg:#3a2e14;--danger-bg:#3b221a;--dialog:#2a2723;}
@media (prefers-color-scheme: dark){.st-root[data-theme="auto"]{--bg:#151412;--bg-rgb:21,20,18;--bg2:#1f1c19;--surface:#2a2723;--glass:44,40,36;--edge:96,88,79;--ink:#f2eee9;--ink-rgb:242,238,233;--ink2:#d3cbc1;--ink2b:#c6bdb2;--ink3:#a99f94;--primary:#f2eee9;--on-primary:#1c1b1a;--ok:#9fd3ac;--danger:#f0a58e;--danger2:#f0a58e;--warn:#f0c878;--warn2:#e6c27a;--warn3:#e6c27a;--warn-bg:#3a2e14;--danger-bg:#3b221a;--dialog:#2a2723;}}
.st-root button,.st-root input{color:var(--ink)}
.st-root ::placeholder{color:var(--ink3);opacity:1}
</style>
</helmet>
<div class="st-root" data-theme="{{themeAttr}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg2); font-family: 'Nunito', system-ui, sans-serif; color: var(--ink)">

  <div aria-hidden="true" class="st-fade" style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 0; padding-top: 24px">
    <sc-for list="{{shelves}}" as="shelf" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column">
        <div style="height: 168px; display: flex; align-items: flex-end; gap: 4px; padding: 0 14px">
          <sc-for list="{{shelf.books}}" as="b" hint-placeholder-count="12">
            <div style="{{b.style}}"></div>
          </sc-for>
        </div>
        <div style="height: 10px; background:  #8a7461; box-shadow: 0 4px 10px rgba(60,40,20,0.25)"></div>
      </div>
    </sc-for>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 470px; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); mask-image: linear-gradient(to bottom, transparent 0%, #000 25%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 25%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 470px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); mask-image: linear-gradient(to bottom, transparent 15%, #000 45%); -webkit-mask-image: linear-gradient(to bottom, transparent 15%, #000 45%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 470px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); mask-image: linear-gradient(to bottom, transparent 35%, #000 65%); -webkit-mask-image: linear-gradient(to bottom, transparent 35%, #000 65%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 470px; background:  linear-gradient(to bottom, rgba(28,22,16,0) 0%, rgba(28,22,16,0.5) 25%, rgba(28,22,16,0.8) 100%)"></div>

  <div style="position: absolute; top: 56px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background:  rgba(var(--glass),0.42); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); border: 1px solid rgba(var(--edge),0.6); font-weight: 700; font-size: 15px; color: var(--ink)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"></path><path d="M8 7h7"></path></svg>
      ShelfTap
    </div>
    <div style="padding: 6px 10px; border-radius: 8px; background:  rgba(var(--glass),0.55); font-size: 11px; font-weight: 500; color: var(--ink2)">[Minh họa: thay bằng ảnh thư viện có giấy phép]</div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 40px; display: flex; flex-direction: column; gap: 18px">
    <h1 class="st-rise" style="margin: 0; font-size: 44px; line-height: 1.08; font-weight: 700; color: #ffffff; letter-spacing: -0.5px">Mượn sách<br>chỉ bằng một chạm</h1>
    <p class="st-rise d1" style="margin: 0; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.92)">Tìm sách trong thư viện, chạm điện thoại vào sách để mượn, gia hạn ngay trên máy.</p>
    <div class="st-rise d2" style="display: flex; gap: 12px; align-items: center; margin-top: 6px">
      <a href="CardLogin.dc.html" aria-label="Đăng nhập bằng thẻ thư viện" class="st-press" style="width: 56px; height: 56px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; background:  rgba(var(--glass),0.16); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(var(--edge),0.45); text-decoration: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h4"></path><path d="M15.5 9.5a3 3 0 0 1 0 5"></path><path d="M17.5 8a5.5 5.5 0 0 1 0 8"></path></svg>
      </a>
      <a href="Login.dc.html" class="st-press" style="flex: 1; height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 24px; background:  rgba(var(--glass),0.16); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(var(--edge),0.45); color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 600">
        Bắt đầu
        <span style="width: 40px; height: 40px; border-radius: 999px; background: var(--surface); display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>
        </span>
      </a>
    </div>
    <a href="Guest.dc.html" class="st-rise d3" style="align-self: center; font-size: 14px; font-weight: 500; color: #ffffff; text-underline-offset: 3px">Xem sách mà không cần đăng nhập</a>
  </div>
  <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" class="st-press" style="position: absolute; top: 12px; right: 14px; z-index: 50; height: 30px; padding: 0 12px 0 9px; border-radius: 999px; border: 1px solid rgba(var(--edge),0.7); background: rgba(var(--glass),0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">
    <sc-if value="{{themeIsLight}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
    <sc-if value="{{themeIsDark}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
    {{themeLabel}}
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  __theme() {
    var self = this;
    var t = (this.state && this.state.__theme) || 'auto';
    var sys = typeof window !== 'undefined' && window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false;
    var dark = t === 'dark' || (t === 'auto' && sys);
    var opts = [['auto', 'Theo hệ thống'], ['light', 'Sáng'], ['dark', 'Tối']];
    return {
      themeAttr: t,
      themeLabel: dark ? 'Sáng' : 'Tối',
      themeAria: dark ? 'Xem bản phác ở nền sáng' : 'Xem bản phác ở nền tối',
      themeIsDark: dark,
      themeIsLight: !dark,
      toggleTheme: function () { self.setState({ __theme: dark ? 'light' : 'dark' }); },
      themeOpts: opts.map(function (o) {
        var on = o[0] === t;
        return {
          label: o[1], on: on,
          pick: function () { self.setState({ __theme: o[0] }); },
          style: 'height:40px;border-radius:999px;border:0;font:inherit;font-size:13px;font-weight:' + (on ? '700' : '500') + ';cursor:pointer;background:' + (on ? 'var(--primary)' : 'transparent') + ';color:' + (on ? 'var(--on-primary)' : 'var(--ink2)')
        };
      })
    };
  }
  renderVals() {
    var palette = ['#8e5a3c', '#2f4a44', '#c9a66b', '#6b6f7a', '#b5452b', '#3e3a36', '#d8c9a8', '#556b5a', '#a3633f', '#41506b'];
    var widths = [22, 30, 18, 26, 34, 20, 28, 24, 16, 30, 22, 26];
    var heights = [150, 132, 160, 118, 146, 164, 128, 152, 140, 122, 158, 136];
    var shelves = [];
    for (var s = 0; s < 5; s++) {
      var books = [];
      for (var i = 0; i < 12; i++) {
        var k = (i * 3 + s * 5) % 10;
        var w = widths[(i + s * 2) % 12];
        var h = heights[(i * 5 + s) % 12];
        var lean = (i + s) % 7 === 3 ? 'transform: rotate(-6deg); transform-origin: bottom left;' : '';
        books.push({ style: 'width:' + w + 'px;height:' + h + 'px;background:' + palette[k] + ';border-radius:2px 2px 0 0;box-shadow: inset -3px 0 0 rgba(0,0,0,0.12);' + lean });
      }
      shelves.push({ books: books });
    }
    return Object.assign(this.__theme(), { shelves: shelves });
  }
}
</script>
</body>
</html>
