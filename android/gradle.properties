org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# shelftap.* are read by app/build.gradle.kts. Set them in ~/.gradle/gradle.properties or with -P, not here:
#   shelftap.apiBaseUrl          API base URL, https only (release default is a placeholder host)
#   shelftap.apiPins             comma list of sha256/<base64> SPKI pins for the API host (release only)
#   shelftap.signingCertSha256   hex SHA-256 of the release signing cert; empty skips the tamper check
#   shelftap.inactivityMinutes   auto-logout after this many idle minutes (default 5)
