spring:
  application:
    name: shelftap-server
  datasource:
    url: ${SHELFTAP_DB_URL:jdbc:postgresql://localhost:5432/shelftap}
    username: ${SHELFTAP_DB_USER:shelftap}
    password: ${SHELFTAP_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8443
  # TLS only: there is no plain HTTP listener. The keystore comes from the environment.
  ssl:
    enabled: true
    key-store: ${SHELFTAP_TLS_KEYSTORE:}
    key-store-password: ${SHELFTAP_TLS_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    enabled-protocols: TLSv1.3,TLSv1.2
  max-http-request-header-size: 8KB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Secrets are env vars only. An empty or short value stops the server from starting (ShelfTapProperties).
shelftap:
  jwt:
    key: ${SHELFTAP_JWT_KEY:}
  master:
    key: ${SHELFTAP_MASTER_KEY:}
  gate:
    key: ${SHELFTAP_GATE_KEY:}
